name: q100-smk
# Pipeline driver environment. Rule-level tools come from workflow/envs/*.yaml
# (run with --use-conda). R packages are managed by renv (renv.lock), and R
# (4.6.1) and Quarto (>=1.10) are system installs, not conda packages.
# Versions pinned to those used for the 2026-09-22 manuscript submission.
channels:
  - conda-forge
  - bioconda
channel_priority: strict
dependencies:
  # Workflow management
  - python=3.13
  - snakemake=9.17.2
  - snakefmt=0.11.5
  - graphviz

  # Python linting and tests (make lint / make test-py)
  - ruff
  - pytest
  - pandas

  # Markdown linting
  - markdownlint-cli
