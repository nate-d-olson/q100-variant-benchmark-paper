quarto-required: ">=1.10"

project:
  type: website
  render:
    - "*.qmd"
    - "analysis/"
    - "docs/*md"
    - "!scratch/"
  output-dir: _site

website:
  title: "Q100 Variant Benchmark"
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Manuscript Figures & Tables
        menu:
          - text: "Benchmarkset Characterization (Table 1, Fig 2)"
            href: analysis/benchmarkset_characterization.qmd
          - text: "External Evaluation (Fig 5)"
            href: analysis/external_evaluation.qmd
          - text: "Interval Size Distributions (Fig 6)"
            href: analysis/benchmark_interval_size_distributions.qmd
          - text: "Benchmark Exclusions (Table 4)"
            href: analysis/benchmark_exclusions.qmd
          - text: Manuscript Value Verification
            href: analysis/manuscript_value_verification.qmd
      - text: Supporting Analyses
        menu:
          - text: Benchmark Difficult Regions
            href: analysis/benchmark_difficult.qmd
          - text: Genomic Context Analysis
            href: analysis/genomic_context_analysis.qmd
          - text: Unique Regions
            href: analysis/benchmark_unique_regions.qmd
          - text: Use-Case Evaluation
            href: analysis/use_case_evaluation.qmd
      - text: Documentation
        menu:
          - text: Architecture
            href: docs/architecture.md
          - text: Data Dictionary
            href: docs/data-dictionary.md
          - text: API Reference
            href: docs/api-reference.md
          - text: Pipeline Outputs
            href: docs/pipeline-outputs.md
          - text: Plot Themes Guide
            href: docs/plot_themes_guide.md
          - text: Troubleshooting
            href: docs/troubleshooting.md
      - text: R Reference
        href: r-reference.qmd
      - text: Pipeline README
        href: README.md

execute:
  freeze: auto

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
